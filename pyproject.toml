[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "copycord"
dynamic = ["version"]
description = "Mirror Discord servers in real time, managed from a web dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
# Single source of dependencies for the admin, server and client.
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.26",
    "websockets==13.1",
    "aiohttp>=3.9,<4",
    "aiohttp-socks>=0.8,<1",
    "itsdangerous>=2.1",
    "cryptography>=44.0",
    "tzdata==2025.2",
    "py-cord==2.8.1",
    "curl_cffi==0.16.2",
    "Pillow==12.2.0",
    "audioop-lts==0.2.1; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/Copycord/Copycord"

[project.scripts]
copycord = "copycord.__main__:main"

# Windows: copycordw.exe runs Copycord without a console window (the service uses it).
[project.gui-scripts]
copycordw = "copycord.__main__:main"

# Single source: CURRENT_VERSION in src/copycord/common/config.py ("v3.28.0" -> 3.28.0).
[tool.hatch.version]
path = "src/copycord/common/config.py"
pattern = 'CURRENT_VERSION = "v?(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
# One top-level package, copycord; admin, server, client, common and selfclient
# are its subpackages.
packages = ["src/copycord"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/tests",
    "**/node_modules",
    "src/copycord/admin/web",
    "src/copycord/admin/data",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/copycord",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/node_modules",
    "src/copycord/admin/data",
]

# Adds the built SPA (src/copycord/admin/web/dist) as copycord/admin/web_static; see hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
