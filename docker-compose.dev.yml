# This docker-compose file is used to build & run CopyCord in your local environment
services:
  copycord:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copycord
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PASSWORD=copycord
      - COPYCORD_ENV=dev
