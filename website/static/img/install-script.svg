<text x="410" y="21" fill="#8b8fa3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" text-anchor="middle">install.sh</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" xml:space="preserve">
<text x="18" y="58"><tspan fill="#4ade80">$ </tspan><tspan fill="#e6e6ef">curl -fsSL https://raw.githubusercontent.com/Copycord/Copycord/main/install.sh | sh</tspan></text>
<text x="18" y="94"><tspan fill="#a78bfa" font-weight="700">    ___                             _ </tspan></text>
<text x="18" y="112"><tspan fill="#a78bfa" font-weight="700">   / __|___ _ __ _  _ __ ___ _ _ __| |</tspan></text>
<text x="18" y="130"><tspan fill="#a78bfa" font-weight="700">  | (__/ _ \ '_ \ || / _/ _ \ '_/ _` |</tspan></text>
<text x="18" y="148"><tspan fill="#a78bfa" font-weight="700">   \___\___/ .__/\_, \__\___/_| \__,_|</tspan></text>
<text x="18" y="166"><tspan fill="#a78bfa" font-weight="700">           |_|   |__/</tspan><tspan fill="#8b8fa3">   installer</tspan></text>
<text x="18" y="202"><tspan fill="#f5f5ff" font-weight="700">  Plan</tspan></text>
<text x="18" y="220"><tspan fill="#8b8fa3">  home       </tspan><tspan fill="#e6e6ef">/home/alice/.copycord</tspan></text>
<text x="18" y="238"><tspan fill="#8b8fa3">  method     </tspan><tspan fill="#e6e6ef">release (GitHub release wheel)</tspan></text>
<text x="18" y="256"><tspan fill="#8b8fa3">  repo       </tspan><tspan fill="#e6e6ef">Copycord/Copycord</tspan></text>
<text x="18" y="274"><tspan fill="#8b8fa3">  channel    </tspan><tspan fill="#e6e6ef">stable (newest release)</tspan></text>
<text x="18" y="292"><tspan fill="#8b8fa3">  uv         </tspan><tspan fill="#e6e6ef">not found, will install it from https://astral.sh/uv/install.sh</tspan></text>
<text x="18" y="328"><tspan fill="#a78bfa" font-weight="700">[1/4]</tspan><tspan fill="#f5f5ff" font-weight="700"> Preparing uv</tspan></text>
<text x="18" y="346"><tspan fill="#4ade80">  ✓ </tspan><tspan fill="#e6e6ef">Installing uv</tspan></text>
<text x="18" y="382"><tspan fill="#a78bfa" font-weight="700">[2/4]</tspan><tspan fill="#f5f5ff" font-weight="700"> Finding the release</tspan></text>
<text x="18" y="400"><tspan fill="#4ade80">  ✓ </tspan><tspan fill="#e6e6ef">Release v4.0.0</tspan></text>
<text x="18" y="418"><tspan fill="#8b8fa3">  • </tspan><tspan fill="#8b8fa3">https://github.com/Copycord/Copycord/releases/download/v4.0.0/copycord-4.0.0-py3-none-any.whl</tspan></text>
<text x="18" y="454"><tspan fill="#a78bfa" font-weight="700">[3/4]</tspan><tspan fill="#f5f5ff" font-weight="700"> Installing Copycord</tspan></text>
<text x="18" y="472"><tspan fill="#4ade80">  ✓ </tspan><tspan fill="#e6e6ef">uv tool install copycord v4.0.0</tspan></text>
<text x="18" y="508"><tspan fill="#a78bfa" font-weight="700">[4/4]</tspan><tspan fill="#f5f5ff" font-weight="700"> Finishing up</tspan></text>
<text x="18" y="526"><tspan fill="#4ade80">  ✓ </tspan><tspan fill="#e6e6ef">/home/alice/.local/bin is on PATH</tspan></text>
<text x="18" y="544"><tspan fill="#4ade80">  ✓ </tspan><tspan fill="#e6e6ef">Wrote the settings file /home/alice/.copycord/.env</tspan></text>
<text x="18" y="580"><tspan fill="#a78bfa">  ╭──────────────────────────────────────────────────────╮</tspan></text>
<text x="18" y="598"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#f5f5ff" font-weight="700">Copycord v4.0.0 is installed                        </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="616"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">Home: /home/alice/.copycord                         </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="634"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">Settings: /home/alice/.copycord/.env                </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="652"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">                                                    </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="670"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef" font-weight="700">Default dashboard password: copycord                </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="688"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">  edit it in that file, then: copycord restart      </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="706"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">                                                    </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="724"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">Next:                                               </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="742"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">  copycord run       start Copycord                 </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="760"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">  copycord restart   apply a changed setting        </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="778"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">  copycord update    update it later                </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="796"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">                                                    </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="814"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#e6e6ef">Finish the setup in the dashboard once it runs:     </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="832"><tspan fill="#a78bfa">  │ </tspan><tspan fill="#60a5fa">  http://localhost:8080                             </tspan><tspan fill="#a78bfa"> │</tspan></text>
<text x="18" y="850"><tspan fill="#a78bfa">  ╰──────────────────────────────────────────────────────╯</tspan></text>
<text x="18" y="886"><tspan fill="#8b8fa3">  Open a new shell first if copycord is not found.</tspan></text>
</g></svg>
