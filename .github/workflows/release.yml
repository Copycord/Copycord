name: Release to PyPI

# A published GitHub release tagged v* builds the frontend, the sdist and the
# wheel, and publishes them to PyPI with trusted publishing (no secrets).
# Pre-release tags (v4.0.0b1) become PyPI pre-releases by their version, which
# the beta update channel picks up; final tags feed the stable channel.

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build sdist and wheel
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: CURRENT_VERSION must match the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          current=$(sed -n 's/^CURRENT_VERSION = "\(.*\)"/\1/p' code/common/config.py)
          echo "tag $TAG, CURRENT_VERSION $current"
          if [ "${current#v}" != "${TAG#v}" ]; then
            echo "::error::CURRENT_VERSION in code/common/config.py is '$current' but the release tag is '$TAG'; bump CURRENT_VERSION and tag again"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/admin/frontend/package-lock.json

      - name: Build frontend
        working-directory: code/admin/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pipx run build --sdist --wheel --outdir dist/

      - name: Check the artifacts
        run: |
          ls -l dist/
          ls dist/copycord-*.tar.gz
          wheel=$(ls dist/copycord-*-py3-none-any.whl)
          python - "$wheel" <<'EOF'
          import sys, zipfile
          wheel = sys.argv[1]
          names = zipfile.ZipFile(wheel).namelist()
          if "admin/static/assets/main.js" not in names:
              sys.exit(f"{wheel} has no admin/static/assets/main.js (frontend missing)")
          meta = [n for n in names if n.endswith(".dist-info/METADATA")]
          text = zipfile.ZipFile(wheel).read(meta[0]).decode()
          found = next(line.split(":", 1)[1].strip() for line in text.splitlines()
                       if line.startswith("Version:"))
          print(f"wheel version {found}")
          EOF
          pipx run twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: copycord-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/copycord/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: copycord-dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
