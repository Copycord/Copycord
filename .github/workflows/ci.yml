name: Tests

on:
  pull_request:
    branches: [main, v4-dev]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Explicit bash so run steps get pipefail — otherwise `cmd | tee` swallows
# cmd's exit code and failing tests/lint leave the job green.
defaults:
  run:
    shell: bash

jobs:
  # -----------------------------------------------------------------------
  # 1. Lint — ruff on Python, syntax check via py_compile
  # -----------------------------------------------------------------------
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check code/ 2>&1 | tee /tmp/ruff.txt

      - name: Python syntax check (py_compile)
        run: |
          find code/ -name '*.py' -print0 \
            | xargs -0 python -m py_compile 2>&1 | tee /tmp/pycompile.txt

      - name: Job summary
        if: always()
        run: |
          echo "## Lint & Syntax Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ruff_out=$(cat /tmp/ruff.txt 2>/dev/null || true)
          if [ -z "$ruff_out" ]; then
            echo "**Ruff:** All checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Ruff:** Found issues" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ruff.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          pyc_out=$(cat /tmp/pycompile.txt 2>/dev/null || true)
          if [ -z "$pyc_out" ]; then
            echo "**py_compile:** All files compile OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**py_compile:** Found errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pycompile.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # -----------------------------------------------------------------------
  # 2. DB unit tests
  # -----------------------------------------------------------------------
  test-db:
    name: DB unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run DB tests
        env:
          PYTHONPATH: code
        run: python -m pytest tests/test_db.py -v 2>&1 | tee /tmp/db-tests.txt

      - name: Job summary
        if: always()
        run: |
          echo "## DB Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/db-tests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # 3. Unit tests — API, user-token sending/identity, fingerprint, routing.
  #    Runs the whole tests/ tree except the dependency-light DB tests (which
  #    the test-db job covers). Using the directory (not a file list) means new
  #    test files are picked up automatically.
  # -----------------------------------------------------------------------
  test-suite:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r tests/requirements-test.txt
          pip install pytest-asyncio

      - name: Run unit tests
        env:
          PYTHONPATH: code
        run: python -m pytest tests/ --ignore=tests/test_db.py -v 2>&1 | tee /tmp/tests.txt

      - name: Job summary
        if: always()
        run: |
          echo "## Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -25 /tmp/tests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # 4. Frontend build check
  # -----------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/admin/frontend/package-lock.json

      - name: Install & build frontend
        working-directory: code/admin/frontend
        run: |
          npm ci
          npm run build 2>&1 | tee /tmp/frontend-build.txt

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -15 /tmp/frontend-build.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # 5. Package — wheel with the built frontend, installed into a fresh venv,
  #    smoke-tested with `copycord --version` and `copycord doctor`.
  # -----------------------------------------------------------------------
  package:
    name: Wheel build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/admin/frontend/package-lock.json

      - name: Build frontend
        working-directory: code/admin/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build wheel
        run: pipx run --python python3.14 build --wheel --outdir dist/

      - name: Install wheel into a fresh venv
        run: |
          python -m venv /tmp/cc-venv
          /tmp/cc-venv/bin/python -m pip install --upgrade pip
          /tmp/cc-venv/bin/python -m pip install dist/*.whl

      - name: copycord --version
        working-directory: /tmp
        run: /tmp/cc-venv/bin/copycord --version

      - name: copycord doctor
        working-directory: /tmp
        env:
          DATA_DIR: /tmp/copycord-data
        run: |
          set +e
          /tmp/cc-venv/bin/copycord doctor | tee /tmp/doctor.txt
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^FAIL' /tmp/doctor.txt; then
            echo "::error::copycord doctor reported FAIL"
            exit 1
          fi
          # Only the admin port may warn (the runner could have 8080 taken).
          if grep '^WARN' /tmp/doctor.txt | grep -v '^WARN  admin port:'; then
            echo "::error::copycord doctor warned about something other than the admin port"
            exit 1
          fi
          exit "$rc"

      - uses: actions/upload-artifact@v6
        with:
          name: copycord-wheel
          path: dist/*.whl
          if-no-files-found: error
