name: Release assets

# A published GitHub release tagged v* builds the frontend, the sdist and the
# wheel, and uploads them as assets of that release. install.sh, install.ps1
# and `copycord update` install the wheel asset.
#
# Every release gets a fourth number that only goes up (v4.0.0.1, v4.0.0.2,
# ...). The tag is the version: the build takes it from the tag, and the
# wheel and sdist must carry exactly that version. Whether a release is a beta is
# decided only by its Pre-release checkbox on GitHub: pre-releases feed the
# beta channel, full releases the stable channel. The version carries no
# beta suffix.

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build sdist and wheel
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/copycord/admin/web/package-lock.json

      - name: Build frontend
        working-directory: src/copycord/admin/web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # The version is the tag without the v; it is set explicitly so the build
      # never depends on the history the checkout fetched.
      - name: Build sdist and wheel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: SETUPTOOLS_SCM_PRETEND_VERSION="${TAG#v}" pipx run build --sdist --wheel --outdir dist/

      - name: Check the artifacts
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist/
          # Both file names carry the version: copycord-4.0.0.3.tar.gz, copycord-4.0.0.3-py3-none-any.whl.
          ls "dist/copycord-${TAG#v}.tar.gz"
          wheel=$(ls dist/copycord-*-py3-none-any.whl)
          python - "$wheel" "${TAG#v}" <<'EOF'
          import sys, zipfile
          wheel, expected = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(wheel).namelist()
          if "copycord/admin/web_static/index.html" not in names:
              sys.exit(f"{wheel} has no copycord/admin/web_static/index.html (dashboard missing)")
          if any(n.startswith("copycord/admin/templates/") for n in names):
              sys.exit(f"{wheel} still ships the old Jinja templates")
          meta = [n for n in names if n.endswith(".dist-info/METADATA")]
          text = zipfile.ZipFile(wheel).read(meta[0]).decode()
          found = next(line.split(":", 1)[1].strip() for line in text.splitlines()
                       if line.startswith("Version:"))
          print(f"wheel version {found}, release tag version {expected}")
          if found != expected:
              sys.exit(f"{wheel} is version {found}, but the release tag says {expected}")
          EOF
          pipx run twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: copycord-dist
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: copycord-dist
          path: dist/

      - name: Upload the wheel and sdist to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist/
          gh release upload "$TAG" dist/copycord-*.whl dist/copycord-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
