# Ruff linter configuration for Copycord
# Runs on PRs to catch syntax errors, undefined names, and unused imports

target-version = "py312"

[lint]
select = [
    "E9",    # Runtime errors — syntax errors, IO errors
    "W6",    # Deprecated features
    "F821",  # Undefined names
    "F811",  # Redefinitions
    "BLE001", # Broad except (Exception/BaseException) that neither logs nor re-raises
    "S110"   # try/except/pass
]
ignore = []

# Files that already had broad excepts when BLE001/S110 were turned on (audit F23).
# New files are checked; drop a file from this list once its handlers log or narrow.
[lint.per-file-ignores]
"src/copycord/admin/app.py" = ["BLE001", "S110"]
"src/copycord/admin/auth.py" = ["BLE001", "S110"]
