name: Build & publish Copycord testing containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (leave blank to auto-derive from branch name)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the tags, for the dev version below

      # A test image is always a dev build: the last release tag plus one, the
      # number of commits since it and the commit, as a build of this commit
      # outside Docker would get (v4.0.0.3-5-g1a2b3c4 -> 4.0.0.4.dev5+g1a2b3c4).
      - name: Dev version
        id: version
        shell: bash
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          if desc=$(git describe --tags --long --abbrev=7 --match 'v[0-9]*' 2>/dev/null); then
            rest=${desc%-g*}
            distance=${rest##*-}
            base=${rest%-*}
            base=${base#v}
            version="${base%.*}.$(( ${base##*.} + 1 )).dev${distance}+g${sha}"
          else
            version="0.dev0+g${sha}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lower-case owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tag
        id: tag
        shell: bash
        run: |
          IN_TAG='${{ github.event.inputs.tag }}'
          BRANCH='${{ github.ref_name }}'

          if [ -n "$IN_TAG" ]; then
            TAG_SRC="$IN_TAG"
          else
            TAG_SRC="$BRANCH"
          fi

          TAG=$(echo "$TAG_SRC" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's|[^a-z0-9._-]|-|g' \
            | sed -E 's/^-+//; s/-+$//')

          # enforce 128-char docker tag limit
          if [ ${#TAG} -gt 128 ]; then TAG="${TAG:0:128}"; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/copycord:${{ steps.tag.outputs.tag }}
          build-args: |
            COPYCORD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
