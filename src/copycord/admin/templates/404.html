<!doctype html>
<html lang="en" class="boot">

<head>
  <meta charset="utf-8" />
  <title>Page not found – Copycord</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ request.url_for('static', path='assets/main.css') }}?v={{ version }}">
  <link rel="icon" type="image/png" href="/static/logo.png">
</head>

<body class="page-404">
  <header class="site-header" role="banner">
    <button id="menu-toggle" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="side-menu"
      aria-label="Open menu">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>

    <a class="header-left header-home" href="/" aria-label="Go to Copycord home">
      <img src="/static/logo.png" alt="" aria-hidden="true" class="header-logo" draggable="false" />
      <h1>Copycord</h1>
    </a>

    <div class="header-right">
      <a class="header-docs-btn" href="https://copycord.github.io/Copycord/" target="_blank" rel="noopener"
        aria-label="Documentation">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/>
        </svg>
        <span>Docs</span>
      </a>
    </div>
  </header>

  {% set sidebar_hide = ['forwarding', 'scraper'] %}{% include "_sidebar.html" %}

  <main class="page-main">
    <section class="card" style="max-width: 640px; margin: 40px auto; text-align: center;">
      <h2>404 – Page not found</h2>
      <img src="/static/logo.png"
           alt="Copycord logo"
           draggable="false"
           style="margin-top: 16px; width: 96px; height: auto; opacity: 0.9;" />

      <div class="btns" style="margin-top: 24px; justify-content: center;">
        <a href="/" class="btn btn-ghost">Back to dashboard</a>
      </div>
    </section>
  </main>

  <script type="module" src="{{ request.url_for('static', path='assets/main.js') }}?v={{ version }}"></script>
</body>

</html>
