name: Release assets

# A published GitHub release tagged v* builds the frontend, the sdist and the
# wheel, and uploads them as assets of that release. install.sh, install.ps1
# and `copycord update` install the wheel asset: pre-release tags (v4.0.0b1,
# marked as pre-release on GitHub) feed the beta channel, final releases the
# stable channel.

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build sdist and wheel
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: CURRENT_VERSION must match the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          current=$(sed -n 's/^CURRENT_VERSION = "\(.*\)"/\1/p' src/copycord/common/config.py)
          echo "tag $TAG, CURRENT_VERSION $current"
          if [ "${current#v}" != "${TAG#v}" ]; then
            echo "::error::CURRENT_VERSION in src/copycord/common/config.py is '$current' but the release tag is '$TAG'; bump CURRENT_VERSION and tag again"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/copycord/admin/web/package-lock.json

      - name: Build frontend
        working-directory: src/copycord/admin/web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Build sdist and wheel
        run: pipx run build --sdist --wheel --outdir dist/

      - name: Check the artifacts
        run: |
          ls -l dist/
          ls dist/copycord-*.tar.gz
          wheel=$(ls dist/copycord-*-py3-none-any.whl)
          python - "$wheel" <<'EOF'
          import sys, zipfile
          wheel = sys.argv[1]
          names = zipfile.ZipFile(wheel).namelist()
          if "copycord/admin/web_static/index.html" not in names:
              sys.exit(f"{wheel} has no copycord/admin/web_static/index.html (dashboard missing)")
          if any(n.startswith("copycord/admin/templates/") for n in names):
              sys.exit(f"{wheel} still ships the old Jinja templates")
          meta = [n for n in names if n.endswith(".dist-info/METADATA")]
          text = zipfile.ZipFile(wheel).read(meta[0]).decode()
          found = next(line.split(":", 1)[1].strip() for line in text.splitlines()
                       if line.startswith("Version:"))
          print(f"wheel version {found}")
          EOF
          pipx run twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: copycord-dist
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: copycord-dist
          path: dist/

      - name: Upload the wheel and sdist to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist/
          gh release upload "$TAG" dist/copycord-*.whl dist/copycord-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
