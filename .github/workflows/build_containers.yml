name: Build & publish Copycord container

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lower-case owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Pre-release tags (v4.0.0b1, v4.0.0rc1) never move :latest, so Docker users
      # on :latest stay on the stable release. Same suffixes as update.py accepts.
      - name: Image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ steps.vars.outputs.owner }}/copycord
          REF: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$REF"
            if ! echo "$REF" | grep -Eiq '[0-9](a|alpha|b|beta|c|rc|pre|preview)[-_.]?[0-9]*$|[0-9][-_.](a|alpha|b|beta|c|rc|pre|preview)[-_.]?[0-9]*$'; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
